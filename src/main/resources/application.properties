spring.application.name=medicine-app

spring.datasource.url=jdbc:mysql://localhost:3306/mediflow

spring.datasource.username=root

# PURPOSE:
# Read the database password from an environment variable.
#
# WHY:
# Database credentials should not be hardcoded in the
# application source/configuration file.
spring.datasource.password=${DB_PASSWORD}

 #seeing this line hiberate can create/update table with entity
spring.jpa.hibernate.ddl-auto=update

#hibernate generating sql query --> to show in console page
spring.jpa.show-sql=true


# for pretty format -> sql query
spring.jpa.properties.hibernate.format_sql=true

prescription.upload-dir=E:/Project2026/uploads/prescriptions

# PURPOSE:
# Reads the payment webhook secret from an environment variable.
#
# WHY:
# The webhook secret is sensitive and should not be hardcoded
# in the application configuration.
payment.webhook.secret=${PAYMENT_WEBHOOK_SECRET}

# PURPOSE:
# JWT signing secret used to generate and validate JWT tokens.
#
# WHY:
# The secret should not be hardcoded inside Java source code.
# It will later be provided through an environment variable.
jwt.secret=${JWT_SECRET}

# ============================================================
# LOGGING CONFIGURATION
# ============================================================

# PURPOSE:
# Set the default application logging level.
#
# WHY:
# INFO shows important application events without producing
# too much unnecessary output.
logging.level.root=INFO

# PURPOSE:
# Show detailed logs generated by our MediFlow application.
#
# WHY:
# DEBUG is useful during development for understanding
# application flow and troubleshooting problems.
logging.level.com.mediflow=DEBUG